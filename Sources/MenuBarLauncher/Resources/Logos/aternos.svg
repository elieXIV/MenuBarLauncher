<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00A86B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#008654;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded rectangle background -->
  <rect x="2" y="2" width="28" height="28" rx="6" ry="6" fill="url(#grad)"/>
  <!-- Server rack icon -->
  <g fill="white" opacity="0.95">
    <!-- Left server -->
    <rect x="6" y="7" width="8" height="18" rx="1" ry="1"/>
    <rect x="7" y="9" width="6" height="3" rx="0.5" ry="0.5" opacity="0.6"/>
    <rect x="7" y="14" width="6" height="3" rx="0.5" ry="0.5" opacity="0.6"/>
    <rect x="7" y="19" width="6" height="3" rx="0.5" ry="0.5" opacity="0.6"/>
    <!-- Right server -->
    <rect x="18" y="7" width="8" height="18" rx="1" ry="1"/>
    <rect x="19" y="9" width="6" height="3" rx="0.5" ry="0.5" opacity="0.6"/>
    <rect x="19" y="14" width="6" height="3" rx="0.5" ry="0.5" opacity="0.6"/>
    <rect x="19" y="19" width="6" height="3" rx="0.5" ry="0.5" opacity="0.6"/>
    <!-- Connection lines -->
    <rect x="14" y="15.5" width="4" height="1" rx="0.5" ry="0.5"/>
    <rect x="14" y="17" width="4" height="1" rx="0.5" ry="0.5"/>
  </g>
</svg>